name: Book Tee Time

# Runs in GitHub's cloud — no Mac required.
# Books the upcoming Saturday morning tee time when it opens at 7:00 AM Central.
#
# Chrome runs VISIBLE (not headless) inside a virtual display (Xvfb), because the
# ezlinks booking site blocks true headless browsers with a permanent spinner.

on:
  schedule:
    # Fires Fridays. Two entries cover Central daylight (CDT) and standard (CST)
    # time so the real run always lands early in the local 6 o'clock hour
    # year-round. A guard step below skips the "wrong season" firing.
    # Scheduled early (~6:05) on purpose: GitHub cron routinely starts jobs
    # 5-40 minutes late, and the bot itself sleeps until 6:57 to log in and
    # fires at exactly 7:00:00 — so a big head start costs nothing.
    #   05 11 UTC = 6:05 CDT (summer)  |  5:05 CST (winter -> skipped)
    #   05 12 UTC = 7:05 CDT (skipped) |  6:05 CST (winter)
    - cron: "05 11 * * 5"
    - cron: "05 12 * * 5"
  # Manual "Run workflow" button — bypasses the day/hour guard, so you can test
  # anytime or trigger a booking by hand if a scheduled run ever gets skipped.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (test login + navigation, do NOT reserve)"
        type: boolean
        default: true

# Prevent two overlapping runs from ever booking twice.
concurrency:
  group: book-tee-time
  cancel-in-progress: false

jobs:
  book:
    runs-on: ubuntu-latest
    # Must comfortably cover: sleep from a ~6:05 start to the 7:00 drop, plus
    # the booking flow itself. 30 min was a bug — it killed the job before 7:00.
    timeout-minutes: 90
    env:
      TZ: America/Chicago            # all times in the bot are now Central
      HEADLESS: "false"              # visible Chrome under Xvfb
      DAYS_AHEAD: "8"                # Friday + 8 days = the newly-opened Saturday
      # Manual runs default to a safe dry run; scheduled runs book for real.
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      BHCC_USERNAME: ${{ secrets.BHCC_USERNAME }}
      BHCC_PASSWORD: ${{ secrets.BHCC_PASSWORD }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Gate to the correct seasonal firing
        id: gate
        # The only job of this guard is to skip the wrong-season duplicate cron.
        # It must NOT look at the clock: GitHub often starts scheduled jobs
        # 5-40 minutes late, and an hour-based check would silently skip a
        # late-but-perfectly-bookable run. Matching the cron expression against
        # the current timezone abbreviation is delay-proof.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — skipping the schedule guard."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ZONE=$(date +%Z)   # CDT in summer, CST in winter (TZ=America/Chicago)
          SCHED="${{ github.event.schedule }}"
          if { [ "$SCHED" = "05 11 * * 5" ] && [ "$ZONE" = "CDT" ]; } || \
             { [ "$SCHED" = "05 12 * * 5" ] && [ "$ZONE" = "CST" ]; }; then
            echo "Correct seasonal firing (cron '$SCHED', zone $ZONE) — proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Wrong-season firing (cron '$SCHED', zone $ZONE) — skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Google Chrome
        if: steps.gate.outputs.proceed == 'true'
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Xvfb
        if: steps.gate.outputs.proceed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Set up Python
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        if: steps.gate.outputs.proceed == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run booking bot (visible Chrome via Xvfb)
        id: run_bot
        if: steps.gate.outputs.proceed == 'true'
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" \
            python book_tee_time.py

      - name: Write run summary
        if: always() && steps.gate.outputs.proceed == 'true'
        run: |
          {
            echo "## Tee-time booking run"
            echo ""
            if [ "${{ steps.run_bot.outcome }}" = "success" ]; then
              echo "**Result: ✅ bot finished successfully.** Check for the club's confirmation email."
            else
              echo "**Result: ❌ bot did NOT complete.** See the log tail and screenshots below."
            fi
            echo ""
            echo "### Last 40 log lines"
            echo '```'
            LATEST_LOG=$(ls -t logs/booking_*.log 2>/dev/null | head -1)
            if [ -n "$LATEST_LOG" ]; then tail -n 40 "$LATEST_LOG"; else echo "(no log file found)"; fi
            echo '```'
            echo ""
            echo "### Captured screenshots / page dumps"
            if ls screenshots/* >/dev/null 2>&1; then
              for f in screenshots/*; do echo "- $(basename "$f")"; done
            else
              echo "(none captured)"
            fi
            echo ""
            echo "_Full logs, screenshots, and page HTML are in the run's Artifacts._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshots and logs (for debugging)
        if: always() && steps.gate.outputs.proceed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: booking-run-${{ github.run_id }}
          path: |
            screenshots/
            logs/
          if-no-files-found: ignore
          retention-days: 14
