name: Book Tee Time

# Runs in GitHub's cloud — no Mac required.
# Books the upcoming Saturday morning tee time when it opens at 7:00 AM Central.
#
# Chrome runs VISIBLE (not headless) inside a virtual display (Xvfb), because the
# ezlinks booking site blocks true headless browsers with a permanent spinner.

on:
  schedule:
    # Fires Fridays, several times. GitHub's cron scheduler is BEST-EFFORT:
    # firings are routinely 5-40 minutes late and are sometimes dropped
    # entirely (on 2026-07-31 BOTH scheduled firings were silently dropped —
    # zero runs). So we schedule six staggered firings; every one of them
    # lands before the 7:00 AM Central drop in its season, the bot sleeps
    # until 6:57, logs in, and clicks Search at exactly 7:00:00. Whichever
    # firing actually starts first does the booking; a dedupe check in the
    # gate step makes every later firing a no-op once one has succeeded, and
    # the concurrency group serializes any overlap. Odd minutes on purpose:
    # GitHub load-sheds hardest on :00/:05/:30 slots.
    # Central local times — summer (CDT): 5:34, 5:52, 6:11, 6:34, 6:52, 7:11
    #                       winter (CST): 4:34, 4:52, 5:11, 5:34, 5:52, 6:11
    - cron: "34 10 * * 5"
    - cron: "52 10 * * 5"
    - cron: "11 11 * * 5"
    - cron: "34 11 * * 5"
    - cron: "52 11 * * 5"
    - cron: "11 12 * * 5"
  # Manual "Run workflow" button — bypasses the day/hour guard, so you can test
  # anytime or trigger a booking by hand if a scheduled run ever gets skipped.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (test login + navigation, do NOT reserve)"
        type: boolean
        default: true

# Prevent two overlapping runs from ever booking twice.
concurrency:
  group: book-tee-time
  cancel-in-progress: false

jobs:
  book:
    runs-on: ubuntu-latest
    # Must comfortably cover the sleep from the earliest winter firing
    # (4:34 AM Central) to the 7:00 drop, plus the booking flow itself.
    # Sleeping runner minutes are free on a public repo.
    timeout-minutes: 170
    env:
      TZ: America/Chicago            # all times in the bot are now Central
      HEADLESS: "false"              # visible Chrome under Xvfb
      DAYS_AHEAD: "8"                # Friday + 8 days = the newly-opened Saturday
      # Manual runs default to a safe dry run; scheduled runs book for real.
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      BHCC_USERNAME: ${{ secrets.BHCC_USERNAME }}
      BHCC_PASSWORD: ${{ secrets.BHCC_PASSWORD }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Gate — skip if a scheduled run already booked today
        id: gate
        # The staggered crons are redundancy against GitHub dropping firings,
        # not extra bookings: once one scheduled run has succeeded today
        # (success == it booked), every later firing must no-op. Failed runs
        # (e.g. no times found) do NOT block later firings — those act as
        # retries. Manual runs always proceed. Deliberately no clock check:
        # hour-based guards silently skip late-started runs.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY=$(date -u +%Y-%m-%d)   # all firings share one UTC date
          BOOKED=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=schedule&status=success&created=${TODAY}" \
            --jq '[.workflow_runs[] | select(.path==".github/workflows/book-tee-time.yml")] | length')
          if [ "${BOOKED:-0}" -gt 0 ]; then
            echo "A scheduled run already succeeded today — skipping this firing."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "No successful scheduled run yet today — proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Google Chrome
        if: steps.gate.outputs.proceed == 'true'
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Xvfb
        if: steps.gate.outputs.proceed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Set up Python
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        if: steps.gate.outputs.proceed == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run booking bot (visible Chrome via Xvfb)
        id: run_bot
        if: steps.gate.outputs.proceed == 'true'
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" \
            python book_tee_time.py

      - name: Write run summary
        if: always() && steps.gate.outputs.proceed == 'true'
        run: |
          {
            echo "## Tee-time booking run"
            echo ""
            if [ "${{ steps.run_bot.outcome }}" = "success" ]; then
              echo "**Result: ✅ bot finished successfully.** Check for the club's confirmation email."
            else
              echo "**Result: ❌ bot did NOT complete.** See the log tail and screenshots below."
            fi
            echo ""
            echo "### Last 40 log lines"
            echo '```'
            LATEST_LOG=$(ls -t logs/booking_*.log 2>/dev/null | head -1)
            if [ -n "$LATEST_LOG" ]; then tail -n 40 "$LATEST_LOG"; else echo "(no log file found)"; fi
            echo '```'
            echo ""
            echo "### Captured screenshots / page dumps"
            if ls screenshots/* >/dev/null 2>&1; then
              for f in screenshots/*; do echo "- $(basename "$f")"; done
            else
              echo "(none captured)"
            fi
            echo ""
            echo "_Full logs, screenshots, and page HTML are in the run's Artifacts._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshots and logs (for debugging)
        if: always() && steps.gate.outputs.proceed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: booking-run-${{ github.run_id }}
          path: |
            screenshots/
            logs/
          if-no-files-found: ignore
          retention-days: 14
