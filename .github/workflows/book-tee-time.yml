name: Book Tee Time

# Runs in GitHub's cloud — no Mac required.
# Books the upcoming Saturday morning tee time when it opens at 7:00 AM Central.
#
# Chrome runs VISIBLE (not headless) inside a virtual display (Xvfb), because the
# ezlinks booking site blocks true headless browsers with a permanent spinner.

on:
  schedule:
    # Fires Fridays. Two entries cover Central daylight (CDT) and standard (CST)
    # time so the real run always lands in the local 6 o'clock hour year-round.
    # A guard step below skips the "wrong season" firing.
    #   25 11 UTC = 6:25 CDT (summer)  |  5:25 CST (winter -> skipped)
    #   25 12 UTC = 7:25 CDT (skipped) |  6:25 CST (winter)
    - cron: "25 11 * * 5"
    - cron: "25 12 * * 5"
  # Manual "Run workflow" button — bypasses the day/hour guard, so you can test
  # anytime or trigger a booking by hand if a scheduled run ever gets skipped.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (test login + navigation, do NOT reserve)"
        type: boolean
        default: true

# Prevent two overlapping runs from ever booking twice.
concurrency:
  group: book-tee-time
  cancel-in-progress: false

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/Chicago            # all times in the bot are now Central
      HEADLESS: "false"              # visible Chrome under Xvfb
      DAYS_AHEAD: "8"                # Friday + 8 days = the newly-opened Saturday
      # Manual runs default to a safe dry run; scheduled runs book for real.
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      BHCC_USERNAME: ${{ secrets.BHCC_USERNAME }}
      BHCC_PASSWORD: ${{ secrets.BHCC_PASSWORD }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Gate scheduled runs to Friday ~6 AM Central
        id: gate
        run: |
          DOW=$(date +%u)   # 5 = Friday
          HOUR=$(date +%H)  # local hour (TZ=America/Chicago)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — skipping the day/hour guard."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [ "$DOW" = "5" ] && [ "$HOUR" = "06" ]; then
            echo "Friday $HOUR:00 Central — proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not the intended window (DOW=$DOW HOUR=$HOUR CT). Skipping this firing."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Google Chrome
        if: steps.gate.outputs.proceed == 'true'
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Xvfb
        if: steps.gate.outputs.proceed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Set up Python
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        if: steps.gate.outputs.proceed == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run booking bot (visible Chrome via Xvfb)
        id: run_bot
        if: steps.gate.outputs.proceed == 'true'
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" \
            python book_tee_time.py

      - name: Write run summary
        if: always() && steps.gate.outputs.proceed == 'true'
        run: |
          {
            echo "## Tee-time booking run"
            echo ""
            if [ "${{ steps.run_bot.outcome }}" = "success" ]; then
              echo "**Result: ✅ bot finished successfully.** Check for the club's confirmation email."
            else
              echo "**Result: ❌ bot did NOT complete.** See the log tail and screenshots below."
            fi
            echo ""
            echo "### Last 40 log lines"
            echo '```'
            LATEST_LOG=$(ls -t logs/booking_*.log 2>/dev/null | head -1)
            if [ -n "$LATEST_LOG" ]; then tail -n 40 "$LATEST_LOG"; else echo "(no log file found)"; fi
            echo '```'
            echo ""
            echo "### Captured screenshots / page dumps"
            if ls screenshots/* >/dev/null 2>&1; then
              for f in screenshots/*; do echo "- $(basename "$f")"; done
            else
              echo "(none captured)"
            fi
            echo ""
            echo "_Full logs, screenshots, and page HTML are in the run's Artifacts._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshots and logs (for debugging)
        if: always() && steps.gate.outputs.proceed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: booking-run-${{ github.run_id }}
          path: |
            screenshots/
            logs/
          if-no-files-found: ignore
          retention-days: 14
